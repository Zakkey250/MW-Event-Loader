; Install as scripts/EventLoader/EventLoader.ini; preserve existing settings on update.
; Existing runtime/profile/test settings must be preserved.
[Updates]
; Startup notification only. No automatic download or installation.
; Checks only Event Loader releases, not Cutscene Converter releases.
Enabled=1
; auto / ja / en. Restart after changing.
Language=auto

[Debug]
Logging=0
; Detailed controller diagnostics can perturb frame times; explicit opt-in.
NeoDiagnostics=0

[NeoAI]
Enabled=1
; CPU-only local plans run on one worker. Live controls and safety stay native.
; 0 retains synchronous planning for diagnosis; unrelated game settings unchanged.
AsyncPlanning=1
; No fixed race speed cap. Legacy MaxTargetSpeedKmh is ignored.
MaxLateralAcceleration=50
DebugTelemetry=0

[Difficulty]
; 難易度の正規ファイルはゲーム直下の NFSMWEventLoader.ini です。
; scripts 内の同名ファイルは難易度設定には使われません。変更後はゲームを再起動してください。
; BlacklistScalingEnabled=1: 有効な対象AIのBL15=1.40からBL1=1.75まで、1段階ごとに0.025加算。
; 曲線が有効な既知BLでは曲線を優先。0またはBL不明時は EnginePowerScale を使用します。
; 既存の Enabled / CatchUpEnabled / NitrousEnabled と通常キャッチアップ設定は保持します。
; FarCatchUpEnabled=1: AIがプレイヤーから301m以上遅れた時、追加倍率の下限を2.50にします。
; 300m以下の通常50～600m smoothstep、順位2～16・対象AI限定という条件は維持します。
; 総倍率=基礎倍率×キャッチアップ倍率。既定ではBL15で3.50倍、BL1で4.375倍です。
; CatchUpEnabled=0で通常/遠距離の両方を停止。Enabled=0でエンジン出力補正を停止します。
; NitrousEnabledは別設定です。テスト用ファイルはこの設定には含まれません。
BlacklistScalingEnabled=1
Blacklist15PowerScale=1.40
Blacklist1PowerScale=1.75
FarCatchUpEnabled=1
FarCatchUpMetres=301
FarCatchUpScale=2.50
; Enabled=0 removes engine-output multipliers; NOS is controlled separately.
Enabled=1
EnginePowerScale=1.75
CatchUpEnabled=1
CatchUpMaxScale=2.0
CatchUpStartMetres=50
CatchUpFullMetres=600
NitrousEnabled=1

[Audio]
; 4 is stock. 5 or 6 enables experimental native event allocation extension.
; Requires LB resource ABI v1 with an expanded mixer >=8 MiB; otherwise 4.
; Change before restarting the game. Never changes a live pool's size.
NativeEngineVoices=4
