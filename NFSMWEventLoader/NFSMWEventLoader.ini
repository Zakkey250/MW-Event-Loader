; MW Event Loader | MW Event Loader 1.0.2
; JA: 配置先: scripts/EventLoader/EventLoader.ini
; EN: Install at: scripts/EventLoader/EventLoader.ini
; JA: 変更後はゲームを再起動してください。スイッチは 0=無効 / 1=有効です。
; EN: Restart the game after changes. Switches: 0=off / 1=on.
; JA: 更新時は既存INIを保存し、必要な項目だけ手動で追加してください。
; EN: Keep your existing INI when updating; add only settings you need.
; JA: 数値の小数点には . を使用します。診断ログは通常OFFのままにしてください。
; EN: Use . as the decimal separator. Normally leave diagnostic logging OFF.
; JA: イベントごとの武器・弾数・HP・表示はエディタで設定します。
; EN: Set event weapons, ammunition, health and displays in the editor.
; JA: 旧MaxTargetSpeedKmhは廃止済みです。ここに追加しても速度制限にはなりません。
; EN: Legacy MaxTargetSpeedKmh is ignored; adding it does not impose a speed limit.

[Updates]
; JA: 起動時に本体の更新を通知します。自動ダウンロード・導入はしません。
; EN: Show startup notices for Event Loader updates; never download or install updates automatically.
Enabled=1
; JA: 更新通知の言語: auto / ja / en。autoはゲーム環境から判定します。
; EN: Update-notice language: auto / ja / en. auto detects the game environment.
Language=auto

[CarbonIntro]
; JA: ローカル変換した追加開始演出を有効化。素材がない場合はMW純正演出を使用します。
; EN: Enable locally converted start cutscenes; use the native MW intro when suitable assets are unavailable.
Enabled=1

[Runtime]
; JA: カスタムイベント中の純正交通密度に掛ける割合。0～100%。フリーローム・警察・出走台数は対象外です。
; EN: Percentage applied to native traffic density in custom events: 0–100%. Does not change free-roam traffic, police or grid size.
RaceTrafficPercent=30

[NeoAI]
; JA: NeoAI経路を指定したカスタムイベントで走行制御を有効化。純正経路をNeoAIへ変換する設定ではありません。
; EN: Enable NeoAI control for custom events authored with NeoAI routes; does not convert native routes to NeoAI.
Enabled=1
; JA: 経路計画を専用ワーカーで計算。0は同期計算。車両操作はゲーム側で行います。
; EN: Plan routes on a worker thread; 0 computes synchronously. Vehicle controls remain on the game thread.
AsyncPlanning=1
; JA: コーナー目標速度の横加速度基準。12～70 m/s²。大きいほど高速です。
; EN: Lateral-acceleration target for corner speeds: 12–70 m/s². Higher values allow faster cornering.
MaxLateralAcceleration=50
; JA: NeoAIの詳細計測。調査時のみ1。通常は0にし、Debug.Loggingも確認してください。
; EN: Detailed NeoAI telemetry; use 1 only for diagnosis. Normally keep 0 and check Debug.Logging.
DebugTelemetry=0

[Difficulty]
; JA: 対象AIのエンジン出力補正を有効化。ニトロはNitrousEnabledで別に設定します。
; EN: Enable engine-power multipliers for eligible AI. Nitrous is controlled separately by NitrousEnabled.
Enabled=1
; JA: 基礎出力倍率。1～4倍。BL別補正が有効で順位を特定できる場合はBL別倍率を優先します。
; EN: Base engine-power multiplier: 1–4. Known Blacklist tiers use their tier multiplier when scaling is enabled.
EnginePowerScale=1.75
; JA: BL15～BL1の基礎出力を補間。明示的な1のみ有効。未指定は無効です。
; EN: Interpolate base power between BL15 and BL1. Requires an explicit 1; omitted means off.
BlacklistScalingEnabled=1
; JA: BL15の基礎出力倍率。1～4倍。
; EN: BL15 base engine-power multiplier: 1–4.
Blacklist15PowerScale=1.40
; JA: BL1の基礎出力倍率。1～4倍。中間のBLは直線補間します。
; EN: BL1 base engine-power multiplier: 1–4. Intermediate tiers are linearly interpolated.
Blacklist1PowerScale=1.75
; JA: プレイヤーに遅れた対象AIの追い上げ補正。0で通常・遠距離の両方を停止します。
; EN: Enable catch-up for eligible AI behind the player; 0 disables both regular and far-distance catch-up.
CatchUpEnabled=1
; JA: 通常追い上げの最大追加倍率。1～2倍。基礎出力倍率に乗算します。
; EN: Maximum regular catch-up multiplier: 1–2, multiplied by base engine power.
CatchUpMaxScale=2.0
; JA: 通常追い上げが始まる遅れ距離。0～5000 m。
; EN: Distance behind the player where regular catch-up starts: 0–5000 m.
CatchUpStartMetres=50
; JA: 通常追い上げが最大になる距離。開始距離+1～20000 m。
; EN: Distance where regular catch-up reaches its maximum: start distance + 1 to 20000 m.
CatchUpFullMetres=600
; JA: 遠距離追い上げの下限倍率を有効化。明示的な1のみ有効。CatchUpEnabledにも従います。
; EN: Enable the far-distance catch-up floor. Requires explicit 1 and CatchUpEnabled.
FarCatchUpEnabled=1
; JA: 遠距離追い上げを適用する遅れ距離。1～20000 m。
; EN: Distance behind the player where far-distance catch-up applies: 1–20000 m.
FarCatchUpMetres=301
; JA: 遠距離での追加倍率の下限。1～4倍。基礎出力倍率に乗算します。
; EN: Minimum catch-up multiplier at far distances: 1–4, multiplied by base engine power.
FarCatchUpScale=2.50
; JA: 対象AIのニトロ補助。出力補正のEnabledとは独立です。
; EN: Enable nitrous assistance for eligible AI; independent of the engine-power Enabled switch.
NitrousEnabled=1

[Audio]
; JA: エンジン音の同時枠数。4が純正。5～6は拡張LB（resource ABI v1・ミキサー8 MiB以上）必須。未対応時は4に戻します。
; EN: Concurrent native engine voices: 4 is stock; experimental 5–6 requires LB resource ABI v1 and a mixer of at least 8 MiB, otherwise falls back to 4.
NativeEngineVoices=4

[Debug]
; JA: 診断ログ。明示的な1のみ有効。未指定・不正値はOFF。通常は0。
; EN: Diagnostic log: only explicit 1 enables it. Missing or invalid values mean OFF. Normally use 0.
Logging=0
; JA: 詳細な走行制御診断。Logging=1での調査用。負荷が増えるため通常は0。
; EN: Detailed driving-controller diagnosis with Logging=1; normally 0 because it adds overhead.
NeoDiagnostics=0
; JA: フレーム負荷の詳細計測。Logging=1とNeoDiagnostics=1の調査時のみ使用します。
; EN: Detailed frame profiling; use only for diagnosis with Logging=1 and NeoDiagnostics=1.
PerformanceProfiling=0
